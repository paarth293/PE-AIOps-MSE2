name: MLOps Monitoring and Retraining

on:
  push:
    branches: ["main"]
    paths:
      - "ml_monitoring.py"
      - "requirements.txt"
      - ".github/workflows/mlops.yml"
  workflow_dispatch:
    inputs:
      batch_rows:
        description: "Number of labelled records in the incoming batch"
        required: false
        default: "200"
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read

concurrency:
  group: mlops-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monitor-and-retrain:
    name: Evaluate and train candidate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Initialise champion model
        run: python ml_monitoring.py init

      - name: Create labelled incoming batch
        env:
          BATCH_ROWS: ${{ inputs.batch_rows || '200' }}
        run: python ml_monitoring.py generate-batch artifacts/new_batch.csv --rows "$BATCH_ROWS"

      - name: Run monitoring and retraining quality gate
        run: python ml_monitoring.py run artifacts/new_batch.csv --enforce-gate

      - name: Publish run summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          report_path = Path("reports/evaluation_report.json")
          if not report_path.exists():
              print("## MLOps run\n\nNo evaluation report was produced.")
              raise SystemExit(0)
          report = json.loads(report_path.read_text(encoding="utf-8"))
          gate = report["quality_gate"]
          print("## MLOps monitoring result")
          print(f"- Decision: `{gate['decision']}`")
          print(f"- Candidate eligible: `{gate['eligible_for_promotion']}`")
          print(f"- Champion overwritten: `{report['champion_overwritten']}`")
          print(f"- Champion F1: `{report['champion_metrics']['f1']}`")
          print(f"- Candidate F1: `{report['candidate_metrics']['f1']}`")
          PY

      - name: Upload model and evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlops-run-${{ github.run_number }}
          path: |
            artifacts/
            reports/
          if-no-files-found: error
          retention-days: 14
